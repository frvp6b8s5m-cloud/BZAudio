<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BZaudio // Artist Core Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

    <!-- Top Status Anchors -->
    <div class="hud-bar top-left">[FLOW_AXIS // WAVE_ACTIVE]</div>
    <!-- The Masterpiece Centerpiece Container -->
    <main class="login-container">
        <div class="frosted-glass-card">
            
            <!-- Secure Lock Indicator -->
            <div class="lock-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>

            <h2>ARTIST_CORE_LOGIN</h2>
            <p class="subtitle">Detect your descript to connect to creative artist core description.</p>

            <!-- Handwritten Secure Login Form -->
            <form class="secure-auth-form" id="loginForm">
                <div class="input-block">
                    <label for="artist-id">ARTIST_ID //</label>
                    <input type="text" id="artist-id" autocomplete="off" required>
                </div>
                
                <div class="input-block">
                    <label for="secure-key">SECURE_KEY //</label>
                    <input type="password" id="secure-key" required>
                </div>

                <button type="submit" class="engine-btn">[INITIALIZE_ENGINE]</button>
            </form>

        </div>
    </main>
    <!-- Bottom Status Anchors -->
    <div class="hud-bar bottom-left">[FLOW_AXIS // WAVE_ACTIVE]</div>
    <div class="hud-bar bottom-right">BZ_STUDIOS // DECOMPOSITION</div>

    <script src="login-engine.js"></script>
</body>
</html>
