<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BZaudio // Secure Root Interface</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="login-page">

    <!-- Upper HUD Positioning Matrix -->
    <div class="hud-bar top-left">[FLOW_AXIS // SECURE_CORE_ACTIVE]</div>
    
    <header class="gallery-header" style="position: absolute; top: 0; width: 100%;">
        <div class="logo">IMPASTO // SECURE_GATEWAY</div>
    </header>
    <!-- Central Verification Workspace -->
    <main class="login-container">
        <div class="frosted-glass-card">
            
            <div class="lock-icon" style="color: var(--accent-orange);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>

            <h2>CURATOR_KEY_AUTHORIZATION</h2>
            <p class="subtitle">Input verified identities below to activate your administrative session configuration layer.</p>

            <form class="secure-auth-form" id="loginForm">
                <div class="input-block">
                    <label for="artist-id">ARTIST_ID //</label>
                    <input type="text" id="artist-id" autocomplete="off" required>
                </div>
                
                <div class="input-block">
                    <label for="secure-key">SECURE_KEY //</label>
                    <input type="password" id="secure-key" required>
                </div>

                <button type="submit" class="engine-btn">[INITIALIZE_ENGINE]</button>
            </form>

        </div>
    </main>
    <!-- Lower HUD Positioning Matrix -->
    <div class="hud-bar bottom-left">[SYS_ACCESS // LINKED]</div>
    <div class="hud-bar bottom-right">BZ_STUDIOS // METV_VALIDATION</div>

    <script src="./login-engine.js"></script>
</body>
</html>
