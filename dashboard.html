<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BZaudio // Curator Core</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><div class="section-head"><div><span class="eyebrow">PRIVATE WORKBENCH</span><h1>CURATOR_CORE</h1><p>Authenticated staging environment.</p></div><div><button id="logout" class="ghost-btn">[DISCONNECT]</button></div></div><div class="contact-grid"><section class="glass offer-desk"><span class="eyebrow">INGESTION TERMINAL</span><h2>Stage a barter payload.</h2><textarea id="rawInput" rows="12" placeholder="Paste JSON transaction payload…"></textarea><button id="stage" class="primary-btn">[INJECT_TO_STAGING]</button><p id="stageStatus"></p></section><section class="glass offer-desk"><span class="eyebrow">STAGING TABLE</span><table style="width:100%;border-collapse:collapse"><thead><tr><th>ID</th><th>ARTIST</th><th>OFFER</th><th>SEEK</th></tr></thead><tbody id="stageBody"></tbody></table><button id="promote" class="primary-btn">[PROMOTE_STAGED]</button></section></div><section class="glass offer-desk" style="margin-top:20px;border-color:#b83a3a"><span class="eyebrow">CRITICAL ZONE</span><h2>Purge active floor trades.</h2><p>This clears marketplace trade records in this browser.</p><button id="purge" class="ghost-btn">[PURGE_ALL_ACTIVE_FLOOR_TRADES]</button></section></main><script src="./admin-auth.js"></script><script>requireCurator();const KEY='bplugins_state_v2';const load=()=>JSON.parse(localStorage.getItem(KEY)||'{"trades":[],"plugins":[]}');let staged=[];function draw(){const body=document.querySelector('#stageBody');body.innerHTML=staged.map(x=>`<tr><td>${x.transactionId||x.id||'-'}</td><td>${x.artist||'-'}</td><td>${(x.offeredAssets||x.out||[]).join(', ')}</td><td>${(x.soughtAssets||x.seek||[]).join(', ')}</td></tr>`).join('')||'<tr><td colspan="4">No staged records.</td></tr>'}document.querySelector('#stage').onclick=()=>{try{const x=JSON.parse(document.querySelector('#rawInput').value);if(!x.artist||(!(x.offeredAssets||x.out))||(!(x.soughtAssets||x.seek)))throw 0;staged.push(x);document.querySelector('#rawInput').value='';document.querySelector('#stageStatus').textContent='[STAGED_OK]';draw()}catch{document.querySelector('#stageStatus').textContent='[INGESTION_FAULT] Invalid Bplugins payload.'}};document.querySelector('#promote').onclick=()=>{const s=load();s.trades.push(...staged.map(x=>({id:x.transactionId||Date.now(),artist:x.artist,out:x.offeredAssets||x.out,seek:x.soughtAssets||x.seek,note:x.note||'',created:Date.now()})));localStorage.setItem(KEY,JSON.stringify(s));staged=[];draw();document.querySelector('#stageStatus').textContent='[PROMOTED_TO_LIVE]'};document.querySelector('#purge').onclick=()=>{if(confirm('Purge every active floor trade?')){const s=load();s.trades=[];localStorage.setItem(KEY,JSON.stringify(s));document.querySelector('#stageStatus').textContent='[FLOOR_TRADES_PURGED]'}};document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('bz_curator_session');location.replace('./index.html')};draw();</script></body></html>
